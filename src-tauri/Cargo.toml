[package]
name = "knowledge-pet"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "knowledge_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tokio = { version = "1.54.1", features = ["process", "time", "macros"] }
tauri-plugin-clipboard-manager = "2.5.0"
reqwest = { version = "0.13.5", features = ["json"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-shell = "2.6.0"
tauri-plugin-dialog = "2.8.4"
